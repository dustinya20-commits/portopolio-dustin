kind = "web"
previewPath = "/"
title = "Personal Portfolio"
description = "A single-page personal portfolio for a fresh graduate, showcasing education, skills, selected projects, journey, and contact information in a bold monochrome presentation."
version = "1.0.0"
id = "artifacts/personal-portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20176

[services.development]
run = "pnpm --filter @workspace/personal-portfolio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/personal-portfolio", "run", "build" ]
serve = "static"
publicDir = "artifacts/personal-portfolio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20176"
BASE_PATH = "/"
